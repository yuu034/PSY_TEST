<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSY_TEST</title>
<meta name="theme-color" content="#5b4bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PSY_TEST">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f9;--card:#fff;--fg:#1d2433;--mut:#6b7385;--pri:#5b4bdb;--pri-fg:#fff;--bd:#e3e6ee;--ok:#1f9d63;--warn:#d97706;--star:#f5b301;--soft:#eceafc;--rad:16px}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1c2030;--fg:#eceef6;--mut:#9aa2b8;--pri:#8b7dff;--pri-fg:#12141b;--bd:#2c3248;--soft:#262a44}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar h1{font-size:19px;margin:0;flex:1}
.back{border:0;background:var(--card);color:var(--fg);width:40px;height:40px;border-radius:12px;font-size:22px;cursor:pointer;border:1px solid var(--bd)}
button{font:inherit;color:inherit}
.hero{text-align:center;padding:calc(48px + env(safe-area-inset-top)) 0 24px}
.hero h1{font-size:34px;letter-spacing:2px;margin:0;color:var(--pri)}
.hero p{margin:4px 0 0;color:var(--mut)}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:18px;margin-bottom:12px;cursor:pointer;font-size:18px;font-weight:600}
.menu:active{transform:scale(.99)}
.menu .ic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--soft);border-radius:12px}
.menu .sub{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.menu .badge{margin-left:auto}
.badge{background:var(--pri);color:var(--pri-fg);border-radius:99px;padding:1px 10px;font-size:14px;font-weight:600;min-width:28px;text-align:center}
.badge.zero{background:var(--bd);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:16px;margin-bottom:14px}
.empty{text-align:center;padding:56px 12px}
.empty .big{font-size:52px}
.empty h2{margin:8px 0 4px}
.empty p{color:var(--mut);margin:0 0 20px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--pri);color:var(--pri-fg)}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.btn.danger{background:transparent;color:#d33;border:1px solid var(--bd)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.progress{font-size:14px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.pbar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:12px}
.pbar i{display:block;height:100%;background:var(--pri)}
.head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--bd);color:var(--fg);margin-right:4px}
.tag.past{background:var(--soft);color:var(--pri)}
.star{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.star.on{color:var(--star)}
.qtext{white-space:pre-wrap;font-size:17px;margin-top:10px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 4px;color:var(--mut)}
textarea,input[type=text],input[type=number],input:not([type]),select{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:none}
textarea{resize:vertical;min-height:84px}
textarea:focus,input:focus{border-color:var(--pri)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-size:14px}
.tab.on{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.row .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0;white-space:pre-wrap}
.row .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.row .meta .sp{flex:1}
.ok{color:var(--ok)}.warn{color:var(--warn)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;overflow:auto;font-size:13px;line-height:1.5;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;font-size:14px}
#toast.show{opacity:.95;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='psy_test_v1';
let DB={questions:[]}, practiceId=null, importTab='js';
let browseFilter='all', browseSearch='', formCtx=null;

/* ---------- 資料 ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r){DB=JSON.parse(r);}}catch(e){}if(!DB||!Array.isArray(DB.questions))DB={questions:[]};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('儲存失敗：瀏覽器空間不足');}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const unsaved=()=>DB.questions.filter(q=>!q.saved);
const savedList=()=>DB.questions.filter(q=>q.saved).sort((a,b)=>(!!b.star-!!a.star)||((b.savedAt||0)-(a.savedAt||0)));
const getQ=id=>DB.questions.find(q=>q.id===id);

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- 共用元件 ---------- */
function headHTML(q){
  if(q.kind==='past'){
    const yr=q.year?(/年/.test(q.year)?q.year:q.year+'年'):'';
    const sc=(q.score!==''&&q.score!=null)?(/分/.test(q.score)?q.score:q.score+'分'):'';
    const parts=[yr,q.school,q.qtype,sc].filter(Boolean).map(esc).join(' / ');
    return `<span class="tag past">考古題</span>${parts}`;
  }
  return `<span class="tag">非考古題</span>${esc(q.qtype||'')}`;
}
const page=(title,back,body)=>`<header class="bar">${back?`<button class="back" data-go="${back}" aria-label="返回">‹</button>`:''}<h1>${esc(title)}</h1></header>${body}`;
const empty=(icon,title,msg,go,label,pTitle,back)=>page(pTitle,back,`<div class="empty"><div class="big">${icon}</div><h2>${title}</h2><p>${msg}</p>${go?`<button class="btn" data-go="${go}">${label}</button>`:''}</div>`);

function formHTML(q,mode){
  const total=DB.questions.length, done=DB.questions.filter(x=>x.saved).length;
  const F=[['thought','解題思路'],['concept','重點概念'],['answer','回答'],['correct','正解']];
  const btns=mode==='practice'
    ?`<button class="btn ghost" id="skip">跳過</button><button class="btn" id="save">儲存</button>`
    :`<button class="btn ghost" id="cancel">返回</button><button class="btn" id="save">${q.saved?'儲存':'儲存'}</button>`;
  return `<div class="progress"><span>已作答 ${done} / ${total}</span><span>${total?Math.round(done/total*100):0}%</span></div>
  <div class="pbar"><i style="width:${total?done/total*100:0}%"></i></div>
  <div class="card"><div class="head"><div>${headHTML(q)}</div><button class="star ${q.star?'on':''}" id="star" aria-label="星號">${q.star?'★':'☆'}</button></div>
  <div class="qtext">${esc(q.text)}</div></div>
  ${F.map(([k,l])=>`<label class="f">${l}（選填）</label><textarea data-f="${k}" placeholder="${l}">${esc(q[k]||'')}</textarea>`).join('')}
  <div class="actions">${btns}</div>
  ${mode!=='practice'?`<div style="text-align:center;margin-top:18px"><button class="btn danger sm" id="del">刪除這題</button></div>`:''}`;
}

/* ---------- 頁面 ---------- */
function view_home(){
  const nNew=unsaved().length,nDue=savedList().length,total=DB.questions.length;
  const b=n=>`<span class="badge ${n?'':'zero'}">${n}</span>`;
  return `<div class="hero"><h1>PSY_TEST</h1><p>心理學題庫練習與複習</p></div>
  <button class="menu" data-go="practice"><span class="ic">✏️</span><span>練習新題目<span class="sub">尚未作答的題目</span></span>${b(nNew)}</button>
  <button class="menu" data-go="review"><span class="ic">🔁</span><span>複習舊題目<span class="sub">已儲存的題目</span></span>${b(nDue)}</button>
  <button class="menu" data-go="import"><span class="ic">📥</span><span>匯入題目<span class="sub">JS 檔或手動輸入</span></span></button>
  <button class="menu" data-go="browse"><span class="ic">📚</span><span>瀏覽全部題目<span class="sub">已儲存與未儲存</span></span>${b(total)}</button>`;
}

function view_practice(){
  if(!DB.questions.length)return empty('📭','尚未有題目！','還沒有任何題目，請先匯入。','import','前往匯入題目','練習新題目','home');
  const list=unsaved();
  if(!list.length)return empty('🎉','目前沒有新題目！','所有題目都已作答並儲存，可以去複習了。','review','前往複習舊題目','練習新題目','home');
  let q=DB.questions.find(x=>x.id===practiceId&&!x.saved)||list[0];
  practiceId=q.id; formCtx={q,mode:'practice'};
  return page('練習新題目','home',formHTML(q,'practice'));
}

function itemRow(q,extra){
  const st=q.saved?`<span class="ok">已儲存</span>`:`<span>未儲存</span>`;
  return `<div class="row" data-open="${q.id}"><div class="head"><div>${headHTML(q)}</div><span style="color:${q.star?'var(--star)':'var(--mut)'}">${q.star?'★':''}</span></div><div class="t">${esc(q.text)}</div><div class="meta">${st}<span class="sp"></span>${extra||''}</div></div>`;
}

function view_review(){
  if(!DB.questions.length)return empty('📭','尚未有題目！','還沒有任何題目，請先匯入。','import','前往匯入題目','複習舊題目','home');
  const saved=savedList();
  if(!saved.length)return empty('☕','目前沒有需要複習的題目！','還沒有已儲存的題目，先去練習新題目吧。','practice','前往練習新題目','複習舊題目','home');
  return page('複習舊題目','home',`<div class="progress"><span>已儲存 ${saved.length} 題，點選要複習的題目</span></div>${saved.map(q=>itemRow(q)).join('')}`);
}

function view_r(id){
  const q=getQ(id); if(!q||!q.saved)return view_review();
  formCtx={q,mode:'review'};
  return page('複習','review',formHTML(q,'review'));
}

function view_import(){
  const tabs=`<div class="tabs"><button class="tab ${importTab==='js'?'on':''}" data-it="js">JS 檔匯入</button><button class="tab ${importTab==='manual'?'on':''}" data-it="manual">手動匯入</button></div>`;
  let body;
  if(importTab==='js'){
    body=`<div class="card"><b>選擇題目檔</b><p class="hint">支援 .js（內容呼叫 PSY_IMPORT）或純 JSON 陣列，可一次選多個檔案。重複的題目會自動略過。</p>
    <input type="file" id="file" accept=".js,.json,.txt" multiple>
    <div class="actions"><button class="btn" id="doImport">開始匯入</button></div></div>
    <div class="card"><b>題目檔範例</b>
    <pre id="sample">${esc(SAMPLE)}</pre>
    <div class="actions"><button class="btn ghost" id="copySample">複製範例</button><button class="btn ghost" id="dlSample">下載範例檔</button></div>
    <p class="hint">欄位：type（past＝考古題／normal＝非考古題，省略時有年分或校名就視為考古題）、year、school、qtype、score、question（必填）。也可選填 correct（正解）、star（true／false）。中文欄位名（年分、校名、題型、分數、題目）同樣可用。</p></div>`;
  }else{
    body=`<div class="card"><div class="tabs"><button class="tab on" id="kPast" data-k="past">考古題</button><button class="tab" id="kNorm" data-k="normal">非考古題</button></div>
    <div id="pastF"><div class="grid2"><div><label class="f">年分</label><input id="m_year" inputmode="numeric" placeholder="例：112"></div><div><label class="f">分數</label><input id="m_score" inputmode="decimal" placeholder="例：25"></div></div>
    <label class="f">校名</label><input id="m_school" placeholder="例：台大心理所"></div>
    <label class="f">題型</label><input id="m_qtype" list="qtypes" placeholder="例：申論題"><datalist id="qtypes"><option>選擇題</option><option>申論題</option><option>名詞解釋</option><option>簡答題</option><option>是非題</option><option>計算題</option></datalist>
    <label class="f">題目</label><textarea id="m_text" placeholder="輸入題目內容"></textarea>
    <div class="actions"><button class="btn" id="addManual">新增題目</button></div></div>`;
  }
  return page('匯入題目','home',tabs+body);
}

function view_browse(){
  return page('瀏覽全部題目','home',`<input id="search" placeholder="搜尋題目、校名、題型…" value="${esc(browseSearch)}" style="margin-bottom:10px">
  <div class="tabs" id="ftabs"></div><div id="blist"></div>`);
}
function fillBrowse(){
  const all=DB.questions, s=browseSearch.trim().toLowerCase();
  const F={all:['全部',all.length],new:['未儲存',all.filter(q=>!q.saved).length],saved:['已儲存',all.filter(q=>q.saved).length],star:['星號',all.filter(q=>q.star).length]};
  $('#ftabs').innerHTML=Object.entries(F).map(([k,[l,n]])=>`<button class="tab ${browseFilter===k?'on':''}" data-bf="${k}">${l} ${n}</button>`).join('');
  let list=all.filter(q=>browseFilter==='all'||(browseFilter==='new'&&!q.saved)||(browseFilter==='saved'&&q.saved)||(browseFilter==='star'&&q.star));
  if(s)list=list.filter(q=>[q.text,q.school,q.qtype,q.year,q.thought,q.concept,q.answer,q.correct].join(' ').toLowerCase().includes(s));
  $('#blist').innerHTML=list.length?list.map(q=>itemRow(q,q.saved?'':`<button class="btn sm" data-qs="${q.id}">儲存</button>`)).join(''):`<div class="empty"><div class="big">${all.length?'🔍':'📭'}</div><h2>${all.length?'沒有符合的題目':'尚未有題目！'}</h2></div>`;
}
function view_q(id){
  const q=getQ(id); if(!q)return view_browse();
  formCtx={q,mode:'browse'};
  return page('題目','browse',formHTML(q,'browse'));
}

/* ---------- 路由 ---------- */
function go(h){if(location.hash==='#/'+h)render();else location.hash='#/'+h;}
function render(){
  const [p,id]=(location.hash.replace(/^#\/?/,'')||'home').split('/');
  formCtx=null;
  const V={home:view_home,practice:view_practice,review:view_review,r:()=>view_r(id),import:view_import,browse:view_browse,q:()=>view_q(id)};
  $('#app').innerHTML=(V[p]||view_home)();
  window.scrollTo(0,0);
  if(p==='browse')fillBrowse();
  if(formCtx)bindForm(formCtx);
}
window.addEventListener('hashchange',render);

/* ---------- 表單邏輯 ---------- */
function collect(q){document.querySelectorAll('textarea[data-f]').forEach(t=>q[t.dataset.f]=t.value.trim());}
function bindForm({q,mode}){
  document.querySelectorAll('textarea').forEach(t=>{const fit=()=>{t.style.height='auto';t.style.height=Math.max(84,t.scrollHeight+2)+'px';};t.addEventListener('input',fit);fit();});
  $('#star').onclick=e=>{q.star=!q.star;persist();e.currentTarget.classList.toggle('on',q.star);e.currentTarget.textContent=q.star?'★':'☆';};
  $('#save').onclick=()=>saveQ(q,mode);
  const sk=$('#skip');if(sk)sk.onclick=()=>skip(q);
  const ca=$('#cancel');if(ca)ca.onclick=()=>go(mode==='review'?'review':'browse');
  const de=$('#del');if(de)de.onclick=()=>{if(confirm('確定刪除這題？此動作無法復原。')){DB.questions=DB.questions.filter(x=>x.id!==q.id);persist();toast('已刪除');go(mode==='review'?'review':'browse');}};
}
function saveQ(q,mode){
  collect(q);const now=Date.now();
  if(!q.saved){q.saved=true;q.savedAt=now;}
  q.updatedAt=now;persist();toast('已儲存');
  if(mode==='practice'){practiceId=null;render();}
  else go(mode==='review'?'review':'browse');
}
function skip(q){
  const list=unsaved();
  if(list.length<=1){toast('這是最後一題了');return;}
  const i=list.findIndex(x=>x.id===q.id);
  practiceId=list[(i+1)%list.length].id;render();
}

/* ---------- 匯入 ---------- */
const SAMPLE=`// PSY_TEST 題目檔：把題目放進陣列，交給 PSY_IMPORT 即可
PSY_IMPORT([
  {
    type: "past",            // past＝考古題
    year: 112,
    school: "台大心理所",
    qtype: "申論題",
    score: 25,
    question: "請說明古典制約與操作制約的差異，並各舉一例。"
  },
  {
    type: "normal",          // normal＝非考古題
    qtype: "名詞解釋",
    question: "認知失調（cognitive dissonance）"
  }
]);`;
function norm(o){
  if(!o||typeof o!=='object')return null;
  const g=(...k)=>{for(const x of k)if(o[x]!=null&&o[x]!=='')return o[x];return '';};
  const text=String(g('question','text','題目')).trim();if(!text)return null;
  const year=String(g('year','年分')),school=String(g('school','校名')),score=String(g('score','分數'));
  const t=String(g('type','kind','類型')).toLowerCase();
  const past=t?/past|exam|考古/.test(t):!!(year||school||score);
  const now=Date.now();
  return {id:uid(),kind:past?'past':'normal',year:past?year:'',school:past?school:'',score:past?score:'',qtype:String(g('qtype','題型')),text,
    saved:false,star:g('star','星號')===true,thought:'',concept:'',answer:String(g('answer','回答')),correct:String(g('correct','正解')),createdAt:now};
}
const dupKey=q=>[q.kind,q.year,q.school,q.qtype,q.text].join('|');
function addMany(arr){
  const keys=new Set(DB.questions.map(dupKey));let add=0,dup=0,bad=0;
  for(const o of arr){const q=norm(o);if(!q){bad++;continue;}const k=dupKey(q);if(keys.has(k)){dup++;continue;}keys.add(k);DB.questions.push(q);add++;}
  persist();return {add,dup,bad};
}
async function importFiles(files){
  let tot={add:0,dup:0,bad:0};
  for(const f of files){
    const txt=await f.text();let arr=[];
    try{const j=JSON.parse(txt);arr=Array.isArray(j)?j:(Array.isArray(j.questions)?j.questions:[]);}
    catch(_){try{new Function('PSY_IMPORT',txt)(a=>{if(Array.isArray(a))arr=arr.concat(a);});}catch(e){toast(f.name+' 讀取失敗：'+e.message);return;}}
    const r=addMany(arr);tot.add+=r.add;tot.dup+=r.dup;tot.bad+=r.bad;
  }
  alert(`匯入完成\n新增：${tot.add} 題\n重複略過：${tot.dup} 題\n格式不符：${tot.bad} 題`);
}
const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};

/* ---------- 事件 ---------- */
let manualKind='past';
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open],[data-go]');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.qs!==undefined){e.stopPropagation();const q=getQ(t.dataset.qs);if(q&&confirm('不填寫內容，直接儲存這題？')){saveQuick(q);}return;}
  if(t.dataset.open){const q=getQ(t.dataset.open);if(!q)return;const p=(location.hash.replace(/^#\/?/,'')||'home').split('/')[0];go((p==='review'?'r/':'q/')+q.id);return;}
  if(t.dataset.bf){browseFilter=t.dataset.bf;fillBrowse();return;}
  if(t.dataset.it){importTab=t.dataset.it;render();return;}
  if(t.dataset.k){manualKind=t.dataset.k;$('#kPast').classList.toggle('on',manualKind==='past');$('#kNorm').classList.toggle('on',manualKind==='normal');$('#pastF').style.display=manualKind==='past'?'':'none';return;}
  if(t.id==='doImport'){const f=$('#file').files;if(!f.length){toast('請先選擇檔案');return;}importFiles([...f]);return;}
  if(t.id==='copySample'){navigator.clipboard&&navigator.clipboard.writeText(SAMPLE).then(()=>toast('已複製範例'),()=>toast('複製失敗，請手動選取'));return;}
  if(t.id==='dlSample'){dl('PSY_TEST_題目範例.js',SAMPLE);return;}
  if(t.id==='addManual'){
    const text=$('#m_text').value.trim();if(!text){toast('請輸入題目內容');return;}
    const o={type:manualKind,qtype:$('#m_qtype').value.trim(),question:text};
    if(manualKind==='past'){o.year=$('#m_year').value.trim();o.school=$('#m_school').value.trim();o.score=$('#m_score').value.trim();}
    const r=addMany([o]);toast(r.add?'已新增題目':'此題目已存在');if(r.add)$('#m_text').value='';return;
  }
});
function saveQuick(q){const now=Date.now();q.saved=true;q.savedAt=now;q.updatedAt=now;persist();toast('已儲存');fillBrowse();}
document.addEventListener('input',e=>{if(e.target.id==='search'){browseSearch=e.target.value;fillBrowse();}});

/* ---------- 啟動 ---------- */
load();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
